name: Keep Streamlit App Alive

on:
  schedule:
    # 每隔 4 小時自動執行一次，確保網站保持清醒
    - cron: '0 */4 * * *'
  workflow_dispatch: # 允許手動點擊觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP request to wake up app
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://chengpu-quant-demo.streamlit.app/
